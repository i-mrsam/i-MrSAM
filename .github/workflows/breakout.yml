name: Conway's Game of Life Contribution

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:   

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Game of Life SVG
        uses: satomasahiro2005/contribution-life@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          layout: calendar     
          rule: B3/S23         
          color: hybrid        
          frame_ms: 140        
          out_dir: dist
          name: conway-life

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
